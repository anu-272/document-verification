x-py: &py
  environment: &env
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://aicte:aicte@postgres:5432/aicte
    MINIO_ENDPOINT: minio:9000
    QDRANT_URL: http://qdrant:6333
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    AZURE_DI_ENDPOINT: ${AZURE_DI_ENDPOINT:-}
    AZURE_DI_KEY: ${AZURE_DI_KEY:-}
    JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    USE_MOCK_VERIFICATION: "true"
  depends_on: [redis, postgres, minio, qdrant]

services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: aicte, POSTGRES_PASSWORD: aicte, POSTGRES_DB: aicte}
    volumes: ["./sql:/docker-entrypoint-initdb.d:ro", "pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  redis: {image: "redis:7", ports: ["6379:6379"]}
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  qdrant: {image: qdrant/qdrant, ports: ["6333:6333"]}

  ingestion-api:   {<<: *py, build: {context: ., dockerfile: services/ingestion/Dockerfile}, ports: ["8001:8001"]}
  ingestion-worker:
    <<: *py
    build: {context: ., dockerfile: services/ingestion/Dockerfile}
    command: celery -A services.ingestion.app.tasks worker -Q ingestion -c 2 --loglevel=info
  validation-api:  {<<: *py, build: {context: ., dockerfile: services/validation/Dockerfile}, ports: ["8002:8002"]}
  validation-worker:
    <<: *py
    build: {context: ., dockerfile: services/validation/Dockerfile}
    command: python -m services.validation.app.worker
  anomaly-api:     {<<: *py, build: {context: ., dockerfile: services/anomaly/Dockerfile}, ports: ["8003:8003"]}
  anomaly-listener:
    <<: *py
    build: {context: ., dockerfile: services/anomaly/Dockerfile}
    command: python -m services.anomaly.app.worker
  anomaly-worker:
    <<: *py
    build: {context: ., dockerfile: services/anomaly/Dockerfile}
    command: celery -A services.anomaly.app.tasks worker -Q anomaly -c 4 --loglevel=info
  verification-api: {<<: *py, build: {context: ., dockerfile: services/verification/Dockerfile}, ports: ["8004:8004"]}
  verification-listener:
    <<: *py
    build: {context: ., dockerfile: services/verification/Dockerfile}
    command: python -m services.verification.app.worker
  verification-worker:
    <<: *py
    build: {context: ., dockerfile: services/verification/Dockerfile}
    command: celery -A services.verification.app.tasks worker -B -Q verification --loglevel=info
  compliance-api:  {<<: *py, build: {context: ., dockerfile: services/compliance/Dockerfile}, ports: ["8005:8005"]}
  compliance-worker:
    <<: *py
    build: {context: ., dockerfile: services/compliance/Dockerfile}
    command: python -m services.compliance.app.worker
  dashboard-api:   {<<: *py, build: {context: ., dockerfile: services/dashboard/Dockerfile}, ports: ["8006:8006"]}
  dashboard-projector:
    <<: *py
    build: {context: ., dockerfile: services/dashboard/Dockerfile}
    command: python -m services.dashboard.app.projector
  frontend:
    build: {context: ./frontend}
    ports: ["3000:3000"]
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:8006"}
volumes: {pgdata: {}}
